<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lootjes trekken</title>
<style>
  :root { --red: #b3261e; --dark: #6e130e; --gold: #f2b632; --paper: #fffaf0; --ink: #2b1d14; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; color: var(--ink);
         background: radial-gradient(circle at 50% 0%, var(--red), var(--dark)); }
  main { max-width: 420px; margin: 0 auto; padding: 24px 16px; }
  h1 { color: var(--gold); text-align: center; margin: 0; font-size: 32px;
       text-shadow: 0 2px 0 rgba(0, 0, 0, .3); }
  p.sub { color: var(--paper); text-align: center; margin: 4px 0 0; opacity: .85; }

  .sack { display: block; width: 130px; margin: 12px auto 20px; transform-origin: 50% 90%; }

  .panel { background: var(--paper); border-radius: 14px; padding: 16px;
           box-shadow: 0 8px 24px rgba(0, 0, 0, .3); }
  input { width: 100%; padding: 10px 12px; margin-bottom: 8px; font-size: 16px;
          border: 2px solid #e6d6c3; border-radius: 8px; background: #fff; }
  button { padding: 12px; font-size: 16px; font-weight: 700; border: 0; border-radius: 8px;
           cursor: pointer; background: var(--red); color: #fff; }
  button.big { width: 100%; margin-top: 8px; font-size: 18px; transition: transform .15s; }
  button.big:hover { transform: scale(1.03) rotate(-1deg); }
  button.small { padding: 8px 12px; font-size: 14px; background: var(--gold); color: var(--ink); }
  button.link { width: 100%; margin-top: 12px; background: none; color: var(--ink);
                text-decoration: underline; font-weight: 400; }
  .error { color: var(--red); min-height: 1.2em; margin: 4px 0 0; }

  .row { display: flex; align-items: center; gap: 8px; padding: 10px 0;
         border-bottom: 1px dashed #e6d6c3; }
  .row .who { flex: 1; font-weight: 600; }

  /* A name card while it flies into the sack. */
  .card { position: fixed; z-index: 10; padding: 10px 12px; font-size: 16px; pointer-events: none;
          background: #fff; border: 2px solid var(--gold); border-radius: 8px;
          box-shadow: 0 4px 10px rgba(0, 0, 0, .25); }
  /* Recipient: three paper slips that flip over to show a name. */
  #recipient h2 { margin: 0 0 4px; color: var(--red); }
  .papers { display: flex; gap: 10px; min-height: 96px; margin: 16px 0 8px; }
  .paper { position: relative; z-index: 5; flex: 1; height: 90px; perspective: 600px; }
  .paper .inner { position: relative; height: 100%; transform-style: preserve-3d; }
  .paper .inner.flipped { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
          padding: 6px; border: 2px solid var(--gold); border-radius: 8px; text-align: center;
          backface-visibility: hidden; box-shadow: 0 4px 10px rgba(0, 0, 0, .2); }
  .face.front { font-size: 36px; font-weight: 800; color: var(--gold);
                background: linear-gradient(135deg, #fff 49%, #efe3cf 50%, #fff 51%); }
  .face.back { transform: rotateY(180deg); background: #fff; font-size: 18px; font-weight: 700; }
  .outro { text-align: center; font-weight: 600; }

  /* Falling pepernoten and confetti. */
  .pepernoot, .confetti { position: fixed; top: -20px; z-index: 20; pointer-events: none; }
  .pepernoot { width: 14px; height: 14px; border-radius: 50%;
               background: radial-gradient(circle at 35% 35%, #d39050, #8a4f1f); }
  .confetti { width: 8px; height: 12px; border-radius: 2px; }
  body { overflow-x: hidden; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Lootjes trekken</h1>
  <p class="sub">Iedereen trekt <span id="k-label"></span> lootjes</p>

  <!-- Sinterklaas' sack: body, opening, red ribbon. -->
  <svg id="sack" class="sack" viewBox="0 0 120 130" aria-hidden="true">
    <path d="M38 38 C8 70 6 110 22 120 Q60 134 98 120 C114 110 112 70 82 38 Z" fill="#9a6532"/>
    <path d="M50 70 Q48 95 56 112 M74 66 Q80 90 76 110" stroke="#7d4f24" stroke-width="3" fill="none"/>
    <ellipse cx="60" cy="22" rx="30" ry="12" fill="#7d4f24"/>
    <path d="M32 22 Q60 44 88 22 L82 38 Q60 46 38 38 Z" fill="#9a6532"/>
    <rect x="34" y="32" width="52" height="9" rx="4" fill="#b3261e"/>
    <circle cx="60" cy="36" r="6" fill="#f2b632"/>
  </svg>

  <section id="setup" class="panel">
    <div id="fields"></div>
    <p class="error" id="error"></p>
    <button class="big" id="go">Trek de lootjes!</button>
  </section>

  <section id="links" class="panel" hidden>
    <p>Stuur iedereen <b>persoonlijk</b> hun eigen link (niet in de groepsapp!).</p>
    <div id="rows"></div>
    <button class="link" id="reset">Opnieuw beginnen</button>
  </section>

  <section id="recipient" class="panel" hidden>
    <h2 id="hello"></h2>
    <p id="intro"></p>
    <div id="papers" class="papers"></div>
    <button class="big" id="pull">Trek een lootje!</button>
    <p id="outro" class="outro" hidden>Veel plezier met de cadeautjes, en vergeet de gedichten niet!</p>
  </section>
</main>

<script type="module">
import { loadLootjes } from "./wasm.js";

const N = 7, K = 3, KEY = "lootjes-v2";
const $ = (id) => document.getElementById(id);
$("k-label").textContent = K;

const lootjes = await loadLootjes(await (await fetch("lootjes.wasm")).arrayBuffer());

// --- animation helpers -------------------------------------------------------

const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const rand = (min, max) => min + Math.random() * (max - min);

// element.animate() returns an Animation; its .finished promise lets us
// `await` one animation before starting the next, like a film script.
function animate(el, keyframes, options) {
  if (reducedMotion) return Promise.resolve();
  return el.animate(keyframes, { easing: "ease-in-out", fill: "forwards", ...options }).finished;
}

// Each input turns into a paper card that flies in an arc into the sack.
async function flyIntoSack(inputs) {
  const sack = $("sack").getBoundingClientRect();
  const targetX = sack.left + sack.width / 2;
  const targetY = sack.top + sack.height * 0.25;

  const flights = inputs.map((input, i) => {
    const box = input.getBoundingClientRect();
    const card = document.createElement("div");
    card.className = "card";
    card.textContent = input.value;
    Object.assign(card.style, { left: `${box.left}px`, top: `${box.top}px`, width: `${box.width}px` });
    document.body.append(card);

    const dx = targetX - (box.left + box.width / 2);
    const dy = targetY - (box.top + box.height / 2);
    return animate(card, [
      { transform: "none" },
      { transform: `translate(${dx * 0.5}px, ${dy * 0.5 - 60}px) rotate(${rand(-25, 25)}deg) scale(0.7)`, offset: 0.5 },
      { transform: `translate(${dx}px, ${dy}px) rotate(${rand(-200, 200)}deg) scale(0.05)`, opacity: 0.3 },
    ], { duration: 800, delay: i * 130 }).then(() => card.remove());
  });

  $("fields").style.visibility = "hidden"; // the cards stand in for the inputs now
  await Promise.all(flights);
  $("fields").style.visibility = "";
}

function shakeSack(times = 6) {
  return animate($("sack"), [
    { transform: "rotate(0)" },
    { transform: "rotate(-10deg) scale(1.05)" },
    { transform: "rotate(10deg) scale(1.05)" },
    { transform: "rotate(0)" },
  ], { duration: 280, iterations: times, fill: "none" });
}

const sleep = (ms) => new Promise((r) => setTimeout(r, reducedMotion ? 0 : ms));

// A folded paper flies out of the sack into the next free slot, waits a moment, then flips.
async function pullPaper(name) {
  const paper = document.createElement("div");
  paper.className = "paper";
  paper.innerHTML = `<div class="inner"><div class="face front">?</div><div class="face back"></div></div>`;
  paper.querySelector(".back").textContent = name; // textContent, never innerHTML: the name comes from a link
  $("papers").append(paper);

  // "FLIP" technique: the paper already sits in its final spot. Measure where that is,
  // start the animation offset back at the sack, and play it towards "none" (= its real spot).
  const sack = $("sack").getBoundingClientRect();
  const box = paper.getBoundingClientRect();
  const dx = sack.left + sack.width / 2 - (box.left + box.width / 2);
  const dy = sack.top + sack.height * 0.25 - (box.top + box.height / 2);
  await animate(paper, [
    { transform: `translate(${dx}px, ${dy}px) scale(0.1) rotate(${rand(-90, 90)}deg)`, opacity: 0 },
    { transform: `translate(${dx * 0.5}px, ${dy * 0.5 - 80}px) scale(0.9) rotate(${rand(-20, 20)}deg)`, opacity: 1, offset: 0.5 },
    { transform: "none", opacity: 1 },
  ], { duration: 900, easing: "ease-out" });

  await sleep(400); // suspense…
  const inner = paper.querySelector(".inner");
  await animate(inner, [{ transform: "rotateY(0)" }, { transform: "rotateY(180deg)" }], { duration: 700 });
  inner.classList.add("flipped"); // the final state, also when animations are off
}

// Pepernoten and confetti fall from the top of the screen.
function rain(count = 80) {
  if (reducedMotion) return;
  const colors = ["#b3261e", "#f2b632", "#ffffff", "#2e7d32"];
  for (let i = 0; i < count; i++) {
    const bit = document.createElement("span");
    if (Math.random() < 0.4) {
      bit.className = "pepernoot";
    } else {
      bit.className = "confetti";
      bit.style.background = colors[i % colors.length];
    }
    bit.style.left = `${rand(0, 100)}vw`;
    document.body.append(bit);
    bit.animate([
      { transform: "none" },
      { transform: `translate(${rand(-60, 60)}px, 110vh) rotate(${rand(-720, 720)}deg)` },
    ], { duration: rand(2200, 4000), delay: rand(0, 900), easing: "linear", fill: "backwards" })
      .finished.then(() => bit.remove());
  }
}

// --- screens -----------------------------------------------------------------

function show(section) {
  for (const s of ["setup", "links", "recipient"]) $(s).hidden = s !== section;
}

function renderSetup() {
  $("fields").innerHTML = "";
  for (let i = 0; i < N; i++) {
    const input = document.createElement("input");
    input.placeholder = `Naam ${i + 1}`;
    $("fields").append(input);
  }
  show("setup");
}

function linkFor(code) {
  return `${location.origin}${location.pathname}#${code}`;
}

function renderLinks(state) {
  $("rows").innerHTML = "";
  state.names.forEach((name, i) => {
    const url = linkFor(state.codes[i]);
    const row = document.createElement("div");
    row.className = "row";

    const who = document.createElement("span");
    who.className = "who";
    who.textContent = name;

    const copy = document.createElement("button");
    copy.className = "small";
    copy.textContent = "Kopieer link";
    copy.onclick = async () => {
      try {
        await navigator.clipboard.writeText(url);
        copy.textContent = "Gekopieerd ✓";
        setTimeout(() => (copy.textContent = "Kopieer link"), 1500);
      } catch {
        prompt("Kopieer deze link:", url);
      }
    };
    row.append(who, copy);

    // The phone's share menu (WhatsApp etc.); not every browser has it.
    if (navigator.share) {
      const share = document.createElement("button");
      share.className = "small";
      share.textContent = "Deel";
      share.onclick = () =>
        navigator.share({ title: "Jouw lootjes", text: `Hoi ${name}! Hier kun je je lootjes trekken:`, url }).catch(() => {});
      row.append(share);
    }

    $("rows").append(row);
    // Pop in one after another; fill "backwards" keeps each row invisible during its delay.
    animate(row, [
      { opacity: 0, transform: "translateY(20px) scale(0.6)" },
      { opacity: 1, transform: "none" },
    ], { duration: 400, delay: i * 120, easing: "cubic-bezier(.3, 1.6, .6, 1)", fill: "backwards" });
  });
  show("links");
}

function renderRecipient(code) {
  show("recipient");
  const ticket = lootjes.decode(code);
  if (!ticket) {
    $("hello").textContent = "Oeps!";
    $("intro").textContent = "Deze link klopt niet. Vraag de organisator om je link opnieuw te sturen.";
    $("pull").hidden = true;
    return;
  }

  const [name, ...picks] = ticket;
  $("hello").textContent = `Hoi ${name}!`;
  $("intro").textContent = `Sinterklaas heeft ${picks.length} lootjes voor je in de zak.`;

  let drawn = 0;
  $("pull").onclick = async () => {
    $("pull").disabled = true;
    await shakeSack(3);
    await pullPaper(picks[drawn]);
    drawn++;
    if (drawn < picks.length) {
      $("pull").textContent = "Nog een lootje!";
      $("pull").disabled = false;
    } else {
      $("pull").hidden = true;
      $("outro").hidden = false;
      rain();
    }
  };
}

// --- state -------------------------------------------------------------------

// The organizer's browser remembers the links, never anyone else's.
function load() {
  try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; }
}
function save(state) {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
}

$("go").onclick = async () => {
  const inputs = [...$("fields").querySelectorAll("input")];
  const names = inputs.map((x) => x.value.trim());
  if (names.some((x) => !x)) return ($("error").textContent = "Vul alle namen in.");
  if (new Set(names.map((x) => x.toLowerCase())).size !== N) {
    return ($("error").textContent = "Elke naam mag maar één keer.");
  }

  // Draw and encode first, so nothing can fail halfway through the animation.
  const picks = lootjes.draw(N, K);
  const codes = picks?.map((p, g) => lootjes.encode([names[g], ...p.map((r) => names[r])]));
  if (!codes || codes.includes(null)) {
    return ($("error").textContent = "Trekken mislukt. Zijn de namen niet te lang?");
  }
  $("error").textContent = "";

  const state = { names, codes };
  save(state);

  $("go").disabled = true;
  await flyIntoSack(inputs);
  await shakeSack();
  $("go").disabled = false;
  renderLinks(state);
};

$("reset").onclick = () => {
  if (!confirm("Weet je het zeker? De oude links werken nog, maar je ziet ze hier niet meer.")) return;
  try { localStorage.removeItem(KEY); } catch {}
  renderSetup();
};

// Pasting a different link in the same tab only changes the #, which doesn't reload the page.
addEventListener("hashchange", () => location.reload());

if (location.hash.length > 1) {
  renderRecipient(location.hash.slice(1));
} else {
  const state = load();
  state ? renderLinks(state) : renderSetup();
}
</script>
</body>
</html>
